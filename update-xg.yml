name: Update xG data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python xgstat_xg_scraper.py
      - name: Commit xg.json if it changed
        run: |
          git config user.name "xg-bot"
          git config user.email "xg-bot@users.noreply.github.com"
          git add xg.json
          git diff --staged --quiet || (git commit -m "Update xG data" && git push)
